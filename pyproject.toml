[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bowire-plugin"
version = "0.3.0"
description = "Write a Bowire protocol plugin in Python — JSON-RPC sidecar SDK (stdio + HTTP/SSE)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Küstenlogik" }]
keywords = ["bowire", "plugin", "sidecar", "json-rpc", "protocol", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://bowire.io/"
Repository = "https://github.com/Kuestenlogik/Bowire.Sdk.Python"
"Sidecar spec" = "https://github.com/Kuestenlogik/Bowire/blob/main/docs/architecture/sidecar-plugins.md"

[project.optional-dependencies]
# ruff carries an upper bound on purpose: an unpinned linter means every
# release of it can turn a green CI red on code nobody touched — 0.16.7 did
# exactly that here, with six findings in files last edited in May. Dependabot
# now proposes the bump as a reviewable PR instead.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/bowire_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
