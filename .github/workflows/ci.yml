name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      # The handshake is part of the assertion, not just the id: a reply
      # without protocolVersion is what made the host treat every plugin built
      # with this SDK as a legacy v1 sidecar (#416).
      - name: Example smoke test
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          out=$(echo "$request" | python examples/echo/echo_plugin.py)
          echo "$out"
          echo "$out" | grep -q '"id":"echo"'
          echo "$out" | grep -q '"protocolVersion":1'

  # Against the real host, not a test double: scripts/e2e.py zips the example,
  # installs it as a sidecar plugin the way an operator would, and asks the
  # host to discover through it. On Linux and Windows, because the manifest
  # names its interpreter (`"executable": "python"`) and the point of that is
  # that one manifest starts on both. The host looks a bare name up on PATH
  # (Bowire >= 2.8, Kuestenlogik/Bowire#692), so the `python` setup-python puts
  # there is the one that runs the plugin.
  e2e:
    name: e2e against Bowire (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The host spawns `python echo_plugin.py`, so the SDK has to be
      # importable by that interpreter — a plain `pip install .`, the way a
      # plugin author installs it.
      - name: Install the SDK
        run: python -m pip install .

      # A tool path rather than --global: the script is handed the exact
      # executable, so nothing depends on where each runner image puts
      # global .NET tools on PATH.
      - name: Install the Bowire CLI
        run: dotnet tool install Kuestenlogik.Bowire.Tool --tool-path "$RUNNER_TEMP/bowire-tool"

      - name: Install the example and discover through the real host
        run: python scripts/e2e.py --bowire "$RUNNER_TEMP/bowire-tool/bowire" --work "$RUNNER_TEMP/e2e"

  gate:
    name: gate
    needs: [test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the matrix to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "e2e job did not succeed: ${{ needs.e2e.result }}"
            exit 1
          fi
