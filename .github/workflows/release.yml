name: Release

# Publishes bowire-plugin to PyPI when a version tag is pushed, the way
# Kuestenlogik/Bowire publishes to nuget.org and the Rust SDK to crates.io:
# through Trusted Publishing, so no API token is stored anywhere. The publish
# job's GitHub OIDC token is exchanged for a short-lived PyPI token by
# pypa/gh-action-pypi-publish, which also attaches attestations.
#
# Unlike crates.io and npm, PyPI can trust a workflow before the project
# exists: a "pending publisher" on the PyPI account (owner Kuestenlogik,
# repository Bowire.Sdk.Python, workflow release.yml, environment pypi)
# lets even the first release go through OIDC, and turns into the project's
# trusted publisher when that release lands.
#
# Building and publishing are separate jobs, so the job that holds the
# id-token runs nothing but the upload.
#
# workflow_dispatch publishes an existing tag again. A version already on
# PyPI is skipped, not an error, so a re-run is harmless.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish, e.g. v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.published.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody tagged; refuse it before anything is built.
      - name: The tag names the package's version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "package version $version, tag $TAG"
          test "v$version" = "$TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same gate as CI, on exactly the commit being published.
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m ruff check .

      - name: Already on PyPI?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/bowire-plugin/${{ steps.version.outputs.version }}/json")
          echo "PyPI answered $status"
          if [ "$status" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.exists != 'true'
    runs-on: ubuntu-latest
    # The environment the trusted publisher on PyPI names; protection rules on
    # it (required reviewers, tag-only) apply to every upload.
    environment:
      name: pypi
      url: https://pypi.org/project/bowire-plugin/${{ needs.build.outputs.version }}/
    permissions:
      # PyPI Trusted Publishing: the OIDC token the publish action exchanges.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  skipped:
    name: Nothing to publish
    needs: build
    if: needs.build.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "bowire-plugin ${{ needs.build.outputs.version }} is already on PyPI"
